<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- HEADER (giống trang Home) -->
    <header>
        <div class="container">
            <a href="index.html" class="logo"><span class="icon">&#9835;</span> Musical</a>
            <nav>
                <ul>
                    <li><a href="index.html">About Us</a></li>
                    <li><a href="index.html#music">Music</a></li>
                    <li><a href="index.html#albums">Albums</a></li>
                </ul>
            </nav>
            <div class="auth">
                <a href="login.html" class="btn btn-primary">Sign In</a>
                <a href="login.html#register" class="btn btn-outline">Sign Up</a>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <div class="container">
            <form class="login-box" id="loginForm" novalidate>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="admin@gmail.com">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password">

                <p class="error" id="error"></p>

                <div class="form-row">
                    <label><input type="checkbox" name="remember" checked> Remember Me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login">LOGIN</button>

                <p class="register" id="register">Not a member ? <a href="#">Register</a></p>
            </form>
        </div>
    </main>

    <!-- FOOTER (giống trang Home) -->
    <footer>
        <div class="container">
            <span class="icon">&#9835;</span> Musical Entertainment <span class="icon">&#9835;</span>
        </div>
    </footer>

    <script>
        // Bấm LOGIN -> kiểm tra rồi chuyển về trang Home
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();
            var error = document.getElementById('error');

            if (email === '' || password === '') {
                error.textContent = 'Vui lòng nhập Email và Password!';
                return;
            }
            if (email.indexOf('@') === -1) {
                error.textContent = 'Email không hợp lệ!';
                return;
            }

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
